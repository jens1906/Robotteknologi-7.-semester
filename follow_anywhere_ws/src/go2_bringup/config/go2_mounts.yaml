# Sensor mounts on the Go2, relative to base_link. One source of truth:
# go2_bringup's static TF (real robot and sim) and the Gazebo URDF both read it.
#
# utlidar_lidar: solved from the real robot bag go2_all_topics_6_10_11_28
#   (/utlidar/cloud vs /utlidar/cloud_base share stamps and per-point fields;
#   rigid fit over 58k points, residual < 2e-6 m). Do not hand-edit.
# utlidar_imu: same origin; pitch from the static gravity vector on /utlidar/imu.
# camera_link: RealSense D455, facing forward with its optical axis roughly
#   horizontal. Position is an estimate: measure it on the robot and update.
utlidar_lidar:
  xyz: [0.28216, 0.0, 0.0]
  rpy: [-2.92072, -0.14132, -1.01053]
utlidar_imu:
  xyz: [0.28216, 0.0, 0.0]
  rpy: [0.0, -0.295, 0.0]
camera_link:
  xyz: [0.30, 0.0, 0.10]
  rpy: [0.0, 0.0, 0.0]
