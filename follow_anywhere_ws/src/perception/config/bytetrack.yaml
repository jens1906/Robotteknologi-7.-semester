# ByteTrack (motion only) for the tracker comparison of the perception re-evaluation. The thresholds are the same
# as botsort.yaml, so the comparison differs only in BoT-SORT's extras (camera motion compensation, its Kalman state).

tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.4
track_buffer: 30
match_thresh: 0.8
fuse_score: True
