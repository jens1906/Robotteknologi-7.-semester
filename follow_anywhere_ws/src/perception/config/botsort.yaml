# BoT-SORT (motion only: no camera-motion compensation, no appearance model) for the person detector.
# Settings carried over from the earlier OSNet tests (botsort_tuned.yaml), where they
# were scored against MOT17 ground truth: better than ByteTrack and better than using the YOLO
# detector's features as appearance (that one linked the wrong people, ~3x the ID switches).
# MEASURED on the Orin against ByteTrack with the same thresholds (81 real-time runs: the 9 perception evaluation
# bags x 3 variants x 3 repeats, PerceptionEvaluation/trackerEval): same speed (detector + tracker 17.4 ms both),
# ByteTrack 8 % more tracker ids and more leader track breaks (77 vs 67), and once handed the leader's id to
# another person during a crossing while enrolling (LeaderShuffle): wrong leader for the rest of the run (905
# frames). BoT-SORT: 0 wrong-leader frames.
#
# Frames here are PROCESSED frames: when the detector is slower than the camera, frames are dropped.

tracker_type: botsort
track_high_thresh: 0.25     # first-stage match threshold
track_low_thresh: 0.1       # second-stage threshold (recovers weak boxes of partly hidden people)
new_track_thresh: 0.4       # was 0.25: fewer spurious tracks, each of which burns an ID
track_buffer: 30            # processed frames a lost track is kept
match_thresh: 0.8
fuse_score: True

# Camera motion compensation OFF. MEASURED on the Orin (same 81 runs): sparseOptFlow cost ~12 ms of the
# detector call (29.0 -> 17.4 ms p50, 74 -> 80 % of camera frames processed, 84 -> 73 % of a CPU core) and gave
# no better tracking: same tracker ids per minute (7.6 vs 7.7), 0 wrong-leader frames in both, recall 0.63 vs 0.65,
# also on the high-rotate bag.
gmc_method: none

# Appearance matching is OFF. With the YOLO detector's own features it hurt (more ID switches); the
# leader is re-identified by reid_model.py instead.
with_reid: False
proximity_thresh: 0.5
appearance_thresh: 0.8
model: auto
