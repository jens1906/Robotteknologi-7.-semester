# Parameters of the perception node. Loaded by launch/perception.launch.py (paramsFile:=... to use another).
# Frames: everything published is in base_link (x forward, y left, z up). Units: m, s, rad.
# Topic names are not parameters: they are written in perception_node.py (change them with a remapping in the launch file).
perception_node:
  ros__parameters:
    baseFrame: base_link

    # --- switches -------------------------------------------------------------------------------
    useLidar: true           # lidar for static obstacles; falls back to the depth image when no cloud arrives
    useOdometry: false       # true: remove the robot's own motion from velocities (velocity_compensated)
    useVelocity: false       # false: velocities are published as NaN with velocity_valid = false

    # --- person detector + tracker --------------------------------------------------------------
    detectorModelPath: yolov8n-pose.pt       # pose model: keypoints for depth sampling (and KPR later); relative = working directory
    detectorImageSize: 640                   # the camera's own resolution; 960 was ~2x slower on CPU
    minimumBoxSizePixels: 24                 # px, smaller detections are ignored
    trackerConfigFile: botsort.yaml          # in this package's config/
    requestedDevice: auto                    # auto / cuda / cpu; auto warns loudly when it falls back to CPU

    # --- re-identification + leader (thresholds measured on MOT17 for OSNet) ------------------
    reidModel: osnet
    reidAccept: 0.45                         # distance below which a person can be the leader
    reidDrop: 0.82                           # distance above which the followed person looks wrong
    reidMargin: 0.05                         # lead the best candidate needs over the second best
    reidConfirm: 3                           # wins needed ...
    reidConfirmWindow: 6                     # ... in a candidate's last comparisons
    verifyPeriod: 1.0                        # s between checks of the followed person
    searchPeriod: 0.3                        # s between searches
    searchCandidates: 4                      # people compared per search
    enrollViews: 8                           # views stored when enrolling (the permanent anchors)
    enrollGap: 0.4                           # s between two stored views
    rollingViews: 20                         # views learned while following, oldest go first
    graceTime: 1.0                           # s the followed person may be missing (flicker) before searching
    lostTime: 10.0                           # s of searching before the state becomes LOST
    leaderFile: ~/.ros/follow_anywhere/leader_osnet.npz   # saved leader, loaded at start

    # --- 3D position + Kalman filter ------------------------------------------------------------
    depthMin: 0.3                            # m, depth outside this range is not used
    depthMax: 8.0
    kalmanProcessNoise: 1.0                  # placeholder, tune: how fast velocities may change (m/s^2)
    kalmanMeasurementNoise: 0.1              # placeholder, tune: position noise of one measurement (m)
    trackTimeout: 1.0                        # s without measurement before a filter is dropped

    # --- obstacles ------------------------------------------------------------------------------
    obstacleMaxRange: 6.0                    # m, farther points are ignored
    groundHeight: 0.05                       # m above the ground plane that counts as ground
