# Parameters of the perception node. Loaded by launch/perception.launch.py (paramsFile:=... to use another).
# Frames: everything published is in base_link (x forward, y left, z up). Units: m, s, rad.
# Topic names are not parameters: they are written in perception_node.py (change them with a remapping in the launch file).
perception_node:
  ros__parameters:
    baseFrame: base_link

    # --- switches -------------------------------------------------------------------------------
    useLidar: true           # lidar for static obstacles; falls back to the depth image when no cloud arrives

    # --- person detector + tracker --------------------------------------------------------------
    detectorModelFile: yolov8n-pose.pt       # in resource/models/ (scripts/fetch_models.py); pose model: keypoints for depth sampling
    detectorImageSize: 640                   # the camera's own resolution; 960 was ~2x slower on CPU
    minimumBoxSizePixels: 24                 # px, smaller detections are ignored
    trackerConfigFile: botsort.yaml          # in this package's config/
    requestedDevice: auto                    # auto / cuda / cpu, for the detector and OSNet; auto warns loudly when it falls back to CPU

    # --- re-identification (OSNet) --------------------------------------------------------------
    reidModelFile: osnet.onnx                # in resource/models/ (scripts/fetch_models.py)
    reidThreads: 2                           # CPU threads for OSNet (leaves cores for the detector)
    leaderFile: ~/.ros/follow_anywhere/perception_leader.npz   # saved leader, always loaded at start; deleted by /perception/clear_leader

    # --- leader. Origin of each value: MEASURED = from MOT17 street video (static camera), CHOSEN = picked after a failure
    # --- there, GUESS = engineering judgement, never tuned. NONE of them were tuned on the Go2 / RealSense yet.
    reidAccept: 0.45                         # MEASURED: distance below which a person can be the leader (lets ~0.2% of other people through per comparison)
    reidDrop: 0.82                           # MEASURED: distance above which the followed person looks wrong (above 99% of true views)
    reidMargin: 0.05                         # CHOSEN: lead the best candidate needs over the second best (after a wrong person got through)
    reidConfirm: 3                           # CHOSEN: wins needed ... (frames in a row are correlated, so not "in a row")
    reidConfirmWindow: 6                     # CHOSEN: ... in a candidate's last comparisons
    verifyPeriod: 0.2                        # s between OSNet checks of the followed person; was 1.0, 0 = every frame. ~14 ms per check on CPU
    searchPeriod: 0.3                        # GUESS: s between searches
    searchCandidates: 4                      # GUESS: people compared per search
    averageViews: 5                          # GUESS: a candidate's last views averaged before comparing (one photo is noisy)
    enrollViewsPerDirection: 3               # GUESS: calibration views per facing direction (front, back, side left, side right), the permanent anchors
    enrollMinimumDirections: 1               # GUESS: directions that must be filled to finish after enrollDuration (1 = a calibration without turning still works)
    enrollGap: 0.4                           # GUESS: s between two stored views, so they differ a little
    enrollDuration: 8.0                      # GUESS: s the leader has to turn around; enrolment ends earlier when all four directions are filled
    enrollTimeout: 20.0                      # GUESS: s before an unfinished enrolment is given up
    enrollGraceTime: 2.0                     # CHOSEN: s the person being enrolled may be missing (the tracker drops boxes for a few frames now and then)
    enrollRebindIou: 0.6                     # GUESS: a new track this much on the enrolled person's last box is the same person (track id change)
    viewsPerGroup: 6                         # GUESS: stored views per group (front, back, side left, side right, partly hidden), calibration + learned
    noveltyDistance: 0.25                    # GUESS: a view closer than this to a stored one of its group is not stored again
    trustTime: 3.0                           # GUESS: s after a strong match (below reidAccept) on the same unbroken track in which views are learned
    keypointConfidence: 0.5                  # GUESS: keypoint confidence above which a body point counts as visible
    sideRatio: 0.35                          # GUESS: shoulder width below this share of the torso height = seen from the side
    edgeMarginPixels: 8                      # GUESS: px, a box this close to the left/right image edge is cut off: not compared, not learned
    minimumCropHeightPixels: 96              # GUESS: px, smaller people are not compared or learned (OSNet input is 256 px high)
    graceTime: 1.0                           # CHOSEN: s the followed person may be missing (flicker) before searching
    lostTime: 10.0                           # NEW, untested: s of searching before the state becomes LOST
    crossingIou: 0.15                        # GUESS: another person's box this much over the leader's: OSNet cannot tell them apart, the lock is dropped
    competitorAge: 3.0                       # GUESS: s a visible person's latest distance still counts as a competitor
    loseAfterChecks: 2                       # GUESS: checks in a row that say "different person" before the leader is dropped
    recentDistanceTime: 2.0                  # NEW, untested: s a distance stays printed under a box

    # --- camera mounting: base_link -> camera_link (m, rad, roll/pitch/yaw as static_transform_publisher; negative pitch
    # --- = tilted up). Written by `ros2 run perception calibrate_camera`; perception.launch.py publishes it as a static
    # --- TF (read by the launch file and calibrate_camera, not by the node) ---------------------
    cameraX: 0.355                           # GUESS: 350-360 mm ahead of the power button (~ base_link centre), not calibrated yet
    cameraY: 0.0
    cameraZ: 0.135                           # GUESS: 70-80 mm above the power button, the trunk top is ~0.06 m above base_link
    cameraRoll: 0.0
    cameraPitch: -0.524                      # GUESS: tilted ~30 deg up
    cameraYaw: 0.0

    # --- 3D position ----------------------------------------------------------------------------
    depthMin: 0.3                            # m, depth outside this range is not used
    depthMax: 8.0
    depthPatchPixels: 3                      # GUESS: px around each torso keypoint whose depth is used (3 = 7x7 patch)
    minimumDepthSamples: 5                   # GUESS: valid depth pixels needed, else the middle strip of the box, else no position
    minimumValidDepthShare: 0.3              # GUESS: share of the sampled pixels with usable depth, below = no position (person closer than depthMin)

    # --- velocity (Kalman filter per person, in the odom frame: velocities over the ground) ----------
    kalmanProcessNoise: 1.0                  # GUESS: m/s^2, 1 sigma, how quickly people speed up, stop or turn
    kalmanMeasurementNoise: 0.1              # GUESS: m, 1 sigma, smallest noise of one measured position (the depth spread is used when larger)
    trackTimeout: 1.0                        # GUESS: s without measurement before a person's filter is dropped
    unknownVelocitySigma: 1.5                # GUESS: m/s, 1 sigma, velocity of a person not measured twice yet (walking speed)
    minimumSpeed: 0.15                       # GUESS: m/s, slower is published as 0 (also when slower than 2 sigma)
    jumpDistance: 1.0                        # GUESS: m, a measurement this far from the prediction restarts the filter (swapped id)
    minimumPositionUncertainty: 0.05         # GUESS: m, 1 sigma, published at least this

    # --- robot odometry (/utlidar/robot_odom). None received: the robot counts as standing still ------
    odometryTimeout: 0.5                     # GUESS: s without odometry before it counts as silent (debug line, filters restart when back)
    clockOffsetWindow: 5.0                   # GUESS: s of odometry over which the Go2 clock offset is taken (smallest offset)
    robotMaxSpeed: 0.6                       # GUESS: m/s, the robot's pose uncertainty grows this fast while odometry is silent (highest command in the bags)
    robotMaxYawRate: 1.6                     # GUESS: rad/s, same for the heading

    # --- obstacles ------------------------------------------------------------------------------
    personRadiusMin: 0.15                    # GUESS: m, smallest radius of the circle a person is modelled as (half the box width)
    personRadiusMax: 0.4                     # GUESS: m, largest radius (arms out make the box wide)
    obstacleMaxRange: 6.0                   # m, farther points are ignored
    groundHeight: 0.05                       # m above the ground plane that counts as ground

# Settings of `ros2 run perception calibrate_camera` (camera_calibration_node.py), which writes cameraX..cameraYaw above.
# It reads this section itself, so no --params-file is needed. Scene and use: README, "Camera calibration".
camera_calibration:
  ros__parameters:
    lidarCloudCount: 150                     # GUESS: lidar clouds stacked (~10 s at 15 Hz); the robot must stand still meanwhile
    depthFrameCount: 30                      # GUESS: newest depth frames merged by per-pixel median
    depthMin: 0.5                            # MEASURED: m, the lidar has nothing closer
    depthMax: 4.5                            # GUESS: m, the D455 depth error grows with distance squared; the corner sits at ~3 m
    voxelSize: 0.03                          # GUESS: m, camera points are averaged per cube of this size
    patchSizes: [0.4, 0.2, 0.1]              # MEASURED (0.1 m lidar patches flat on a still floor) / GUESS: m, coarse to fine; the first must cover the start mount's error
    maximumResidual: 0.025                   # GUESS: m, robust sigma of the point-to-plane distances (lidar noise alone is ~0.01)
    minimumMatchedPoints: 2000               # GUESS: camera points on lidar surfaces (a count: most of the tilted view has no lidar)
    minimumDirectionPoints: 100              # CHOSEN: ~ camera points on surfaces facing the weakest direction; synthetic room: walls only 15-35, with the board 208-257
    maximumChangeDistance: 0.15              # GUESS: m, a result farther from the saved (tape) mount is a wrong match: not saved
    maximumChangeAngle: 0.26                 # GUESS: rad (15 deg), same for the rotation
