# Parameters of the lidar obstacles node. Loaded by launch/lidar_obstacles.launch.py (paramsFile:=... to use another).
# Frames: everything is in base_link (x forward, y left, z up). Units: m, s.
# Topic names are not parameters: they are written in lidar_obstacles_node.cpp (change them with a remapping in the launch file).
lidar_obstacles_node:
  ros__parameters:
    # --- lidar points ---------------------------------------------------------------------------
    minRange: 0.15                           # m, horizontal; closer points are ignored
    maxRange: 6.0                            # m, horizontal; farther points are ignored
    minObstacleHeight: -0.20                 # m in base_link; lower points count as ground
    maxObstacleHeight: 1.0                   # m in base_link; higher points are ignored

    # --- clustering -----------------------------------------------------------------------------
    cellSize: 0.10                           # m, grid cell edge
    minClusterCells: 2                       # fewer occupied cells in a cluster: no obstacle
    lidarPositionUncertainty: 0.10           # m, 1 sigma of a lidar obstacle position

    # --- occupancy grid (odom frame) ------------------------------------------------------------
    lidarMountX: 0.28                        # m, beam origin in base_link (go2_bringup/config/go2_mounts.yaml)
    lidarMountZ: 0.0                         # m, beam origin in base_link
    hitScore: 0.85                           # added to a cell per point ending in it
    passScore: 0.4                           # removed from a cell once per frame when a beam passes through it
    occupiedScore: 1.0                       # cell is an obstacle above this score (two points in one frame)
    maxCellScore: 2.0                        # cap; lower = cells an object left clear faster
    minCellScore: -2.0                       # floor; higher = new objects show up faster in seen-free space
    occupiedHoldSeconds: 0.0                 # s, > 0: a cell also needs a hit this recent; 0 = off

    # --- camera people --------------------------------------------------------------------------
    matchDistance: 0.5                       # m, a cluster this close to a predicted person belongs to that person
    maxCameraAge: 0.5                        # s, older camera obstacles / leader are not used

    # --- odometry -------------------------------------------------------------------------------
    odometryTimeout: 0.5                     # s without odometry before the robot counts as standing still
    clockOffsetWindow: 5.0                   # s of odometry over which the Go2 clock offset is taken (smallest offset)
    poseHistorySeconds: 1.0                  # s of robot poses kept to move people to the lidar time
