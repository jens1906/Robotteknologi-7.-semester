<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>web_viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>web_viewer</h1>
      <span id="status" class="bad">disconnected</span>
    </header>
    <button id="perception-toggle" type="button" title="Camera with people boxes and leader certainty, and the dynamic, static and combined obstacle maps">Perception view</button>
    <input id="filter" type="search" placeholder="Filter topics…" autocomplete="off">
    <ul id="topics"></ul>
  </aside>
  <div id="recorder">
    <span id="record-info"></span>
    <input id="bag-title" type="text" placeholder="Bag title…" autocomplete="off" title="Name given to the bag when it is stopped, as <title>_MMDD_HHMM">
    <button id="record-button" type="button" title="Start recording a bag" disabled>▶</button>
  </div>
  <main id="panels">
    <p id="empty">Click a topic on the left to open it, or open the perception view. Images and point clouds are drawn, everything else is shown as JSON.</p>
  </main>
  <script src="app.js"></script>
  <script src="perception.js"></script>
</body>
</html>
