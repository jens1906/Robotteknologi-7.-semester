# Crowded plaza: an open square around a fountain with benches, planters and
# lamp posts. Seven pedestrians look exactly like the leader and cross, pass
# next to and walk alongside its path, to test that the follower keeps the
# right person. Two carts cross the square.

static:
  - {type: cylinder, name: fountain, pose: [3, 4.5], radius: 1.5, length: 0.8, color: [0.6, 0.65, 0.7]}
  - {type: box, name: bench_1, pose: [6, -1.5, 0], size: [1.8, 0.5, 0.45], color: [0.5, 0.35, 0.2]}
  - {type: box, name: bench_2, pose: [-5, -10.5, 0], size: [1.8, 0.5, 0.45], color: [0.5, 0.35, 0.2]}
  - {type: box, name: bench_3, pose: [12, 4, 1.57], size: [1.8, 0.5, 0.45], color: [0.5, 0.35, 0.2]}
  - {type: box, name: bench_4, pose: [-1, 12, 0], size: [1.8, 0.5, 0.45], color: [0.5, 0.35, 0.2]}
  - {type: box, name: kiosk, pose: [-12, 13.5, 0], size: [2.5, 2.0, 2.5], color: [0.8, 0.3, 0.3]}
  - {type: cylinder, name: planter_1, pose: [14, -2], radius: 0.6, length: 0.9, color: [0.3, 0.5, 0.2]}
  - {type: cylinder, name: planter_2, pose: [-11, 0], radius: 0.6, length: 0.9, color: [0.3, 0.5, 0.2]}
  - {type: cylinder, name: planter_3, pose: [5, 12], radius: 0.6, length: 0.9, color: [0.3, 0.5, 0.2]}
  - {type: cylinder, name: planter_4, pose: [1, -12], radius: 0.6, length: 0.9, color: [0.3, 0.5, 0.2]}
  - {type: cylinder, name: lamp_1, pose: [6.5, 1.5], radius: 0.08, length: 3.0, color: [0.15, 0.15, 0.15]}
  - {type: cylinder, name: lamp_2, pose: [-5, 7], radius: 0.08, length: 3.0, color: [0.15, 0.15, 0.15]}
  - {type: cylinder, name: lamp_3, pose: [-6, -1.5], radius: 0.08, length: 3.0, color: [0.15, 0.15, 0.15]}

movers:
  - {name: cart_1, type: box, size: [1.2, 0.7, 1.0], path: [[-13, -3.5], [12, -3.5]], speed: 0.7, color: [0.2, 0.3, 0.8]}
  - {name: cart_2, type: box, size: [1.2, 0.7, 1.0], path: [[-4, 13], [-4, 2]], speed: 0.5, color: [0.2, 0.3, 0.8]}

people:
  - name: leader
    path: [[1.5, 0], [10, 0], [10, 9], [0, 9], [-8, 4], [-8, -6], [0, -6]]
    speed: 0.5
    start_delay: 15
  # Walks right next to the leader's first stretch, in the other direction.
  - {name: pedestrian_1, path: [[13, 1], [-10, 1]], mode: pingpong, speed: 1.1}
  # Crossing the square diagonally.
  - {name: pedestrian_2, path: [[-12, -12], [13, 7]], mode: pingpong, speed: 1.2}
  # Circling the fountain.
  - {name: pedestrian_3, path: [[-0.5, 4.5], [3, 8], [6.5, 4.5], [3, 1]], speed: 0.8}
  # Parallel to the leader's top stretch.
  - {name: pedestrian_4, path: [[-12, 10.2], [13, 10.2]], mode: pingpong, speed: 1.0}
  # Crossing north-south.
  - {name: pedestrian_5, path: [[8, -12], [8, 13]], mode: pingpong, speed: 1.3}
  - {name: pedestrian_6, path: [[-10, -11], [-10, 12]], mode: pingpong, speed: 0.9}
  # Strolling a loop in the south-west.
  - {name: pedestrian_7, path: [[-4, -3], [-1, -11], [6, -9], [3, -4.5]], speed: 0.7}
