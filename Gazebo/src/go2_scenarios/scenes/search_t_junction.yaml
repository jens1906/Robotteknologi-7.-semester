# Search: T-junction (spec scenario 3, hysteresis). The leader turns north at the end of
# the corridor; the target must not dither between the two branches (<= 2 switches).
#
#                 |   |
#                 |   |  north branch
#  y=1.5  +-------+   |
#  Go2 >  | leader -> |  wall at x = 11.5
#  y=-1.5 +-------+   |
#                 |   |  south branch
#               x=8.5 11.5

static:
  - {type: wall, name: corridor_north, from: [-2, 1.5], to: [8.5, 1.5], height: 2.5}
  - {type: wall, name: corridor_south, from: [-2, -1.5], to: [8.5, -1.5], height: 2.5}
  - {type: wall, name: corridor_west, from: [-2, -1.5], to: [-2, 1.5], height: 2.5}
  - {type: wall, name: end_wall, from: [11.5, -12], to: [11.5, 12], height: 2.5}
  - {type: wall, name: north_west, from: [8.5, 1.5], to: [8.5, 12], height: 2.5}
  - {type: wall, name: south_west, from: [8.5, -1.5], to: [8.5, -12], height: 2.5}
  - {type: wall, name: north_end, from: [8.5, 12], to: [11.5, 12], height: 2.5}
  - {type: wall, name: south_end, from: [8.5, -12], to: [11.5, -12], height: 2.5}

people:
  - name: leader
    path: [[1.5, 0], [10, 0], [10, 10]]
    mode: once
    speed: 0.45
    start_delay: 15
