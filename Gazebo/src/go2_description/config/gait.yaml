# CHAMP quadruped_controller parameters for Unitree Go2
# Format follows upstream/champ/champ_config/config/{gait,links,joints}/*.yaml
# — CHAMP reads gait.*, links_map.* and joints_map.* (see champ/utils/urdf_loader.h).
# Ref: khaledgabr77/unitree_go2_ros2 for Gazebo Harmonic + ROS2 Jazzy

/**:
  ros__parameters:
    gait:
      knee_orientation: ">>"        # all knees bend backward
      pantograph_leg: false
      odom_scaler: 0.9
      # Max velocities (matches Go2 sport mode limits)
      max_linear_velocity_x: 0.5    # m/s forward/backward
      max_linear_velocity_y: 0.4    # m/s left/right
      max_angular_velocity_z: 0.5   # rad/s yaw
      com_x_translation: 0.0
      swing_height: 0.04            # m — swing foot clearance
      stance_depth: 0.00            # ground penetration depth (0 = no digging)
      stance_duration: 0.25         # s per stance phase
      nominal_height: 0.225         # m standing height

    # Link chain per leg: hip, thigh, calf, foot (must match URDF link names)
    links_map:
      base: base
      left_front:  [FL_hip, FL_thigh, FL_calf, FL_foot]
      right_front: [FR_hip, FR_thigh, FR_calf, FR_foot]
      left_hind:   [RL_hip, RL_thigh, RL_calf, RL_foot]
      right_hind:  [RR_hip, RR_thigh, RR_calf, RR_foot]

    # Joint chain per leg (must match URDF joint names)
    joints_map:
      left_front:  [FL_hip_joint, FL_thigh_joint, FL_calf_joint, FL_foot_joint]
      right_front: [FR_hip_joint, FR_thigh_joint, FR_calf_joint, FR_foot_joint]
      left_hind:   [RL_hip_joint, RL_thigh_joint, RL_calf_joint, RL_foot_joint]
      right_hind:  [RR_hip_joint, RR_thigh_joint, RR_calf_joint, RR_foot_joint]
