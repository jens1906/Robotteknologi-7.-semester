# ros_gz_bridge configuration for the Unitree Go2 simulation.
# Bridges raw Gazebo data to ROS. go2_robot_emulator then publishes it under
# the physical Go2's topic names, frames, rates and message layouts; nothing
# here is meant to be consumed directly by robot code.
#
# Gazebo Jetty sensor topic suffixes:
#   rgbd_camera: <topic>/image, <topic>/depth_image, <topic>/points, <topic>/camera_info
#   camera:      <topic>  (direct), <topic minus last part>/camera_info
#   gpu_lidar:   <topic>/points for PointCloudPacked
#   imu:         <topic>  (direct, no suffix)

# ---- Simulation clock (required for use_sim_time) ----
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# ---- Joint states (from JointStatePublisher plugin) ----
# World: "go2_world", model: "go2" — must match world SDF and spawn args
- ros_topic_name: "/sim/joint_states"
  gz_topic_name: "/world/go2_world/model/go2/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# ---- Ground-truth body odometry ----
- ros_topic_name: "/sim/odometry"
  gz_topic_name: "/model/go2/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# ---- Body IMU ----
- ros_topic_name: "/sim/imu"
  gz_topic_name: "/imu_gz"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# ---- L1 lidar IMU ----
- ros_topic_name: "/sim/utlidar/imu"
  gz_topic_name: "/utlidar/imu_gz"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# ---- L1 lidar (dense scan, subsampled by the emulator) ----
- ros_topic_name: "/sim/utlidar/raw"
  gz_topic_name: "/utlidar/raw_gz/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# ---- Head camera (encoded to /frontvideostream by the emulator) ----
- ros_topic_name: "/sim/head_camera/image"
  gz_topic_name: "/head_camera_gz"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# ---- RealSense D455 ----
- ros_topic_name: "/sim/d455/color"
  gz_topic_name: "/d455_gz/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/d455/depth"
  gz_topic_name: "/d455_gz/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/d455/camera_info"
  gz_topic_name: "/d455_gz/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
