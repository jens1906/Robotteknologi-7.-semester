services:
  go2_sim:
    build:
      # Repo root: the image also builds follow_anywhere_ws's unitree_go,
      # unitree_api and go2_bringup (Dockerfile.dockerignore limits what is sent).
      context: ..
      dockerfile: Gazebo/Dockerfile
    image: go2_sim:latest
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      # Scene to load (go2_scenarios/scenes): empty, open_field, office,
      # plaza, warehouse. E.g. GO2_WORLD=plaza docker compose up
      - GO2_WORLD=${GO2_WORLD:-empty}
      # Rendering runs on Mesa (Intel/AMD iGPU via /dev/dri). Set
      # LIBGL_ALWAYS_SOFTWARE=1 to force CPU rendering (llvmpipe) instead.
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # The repo, read-only, so the tools can read real robot bags
      # (e.g. /repo/go2_all_topics_6_10_11_28)
      - ..:/repo:ro
    # Mesa DRI render nodes. Not an NVIDIA requirement; works with any
    # Intel/AMD GPU and is harmless if absent from the software path.
    devices:
      - /dev/dri:/dev/dri
    # SELinux (Fedora) blocks access to the host X11 socket otherwise.
    security_opt:
      - label=disable
    # host networking: required for Gazebo transport (DDS multicast) and
    # ros2 DDS discovery to work between container and host
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    # NVIDIA GPU passthrough is opt-in, see docker-compose.gpu.yml.
