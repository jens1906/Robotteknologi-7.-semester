# NVIDIA GPU passthrough (requires nvidia-container-toolkit). Use with:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
services:
  go2_sim:
    environment:
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
